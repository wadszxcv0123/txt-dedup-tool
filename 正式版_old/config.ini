# ============================================
#   TXT查重工具 - 客户端配置文件
#   config.ini
# ============================================
#   修改后直接生效，无需重启
#   格式: 参数名 = 值
#   井号(#)开头的行为注释，不会生效
# ============================================

# ---------- 服务端连接设置 ----------
[Server]

# 服务端地址，格式: http://IP:端口
# 如果服务端和客户端在同一台电脑上，用 localhost
# 局域网访问：http://192.168.167.200:5566
# 仅内网部署，不对外暴露
address = http://192.168.167.200:5566

# ---------- 客户端基本设置 ----------
[Client]

# 输出目录: 查重结果文件保存到哪里
# 留空 = 在输入文件的同目录输出
output_dir = 

# 是否自动保存唯一数据（不在数据库中的新数据）
# true  = 保存到 "文件名_unique.txt"
# false = 不保存
save_unique = false

# 是否自动保存重复数据（数据库里已经有的数据）
# true  = 保存到 "文件名_duplicates.txt"
# false = 不保存
save_duplicates = false

# 线程数: 同时处理数据的线程数
# 0   = 自动（程序根据CPU核心数自动设置，推荐）
# 具体数字 = 比如4，固定使用4个线程
threads = 0

# 分块大小: 每次从文件读取多少行数据去查重
# 数字越大内存占用越多，但速度越快
# 建议 50000 ~ 100000
chunk_size = 100000

# 机台标识: 标记这个客户端是哪个机台
# 比如: A、B、C  或者  机台1、机台2
# 查重日志和邮件会显示这个标识，方便追溯是哪台机器导入的数据
machine_id = 老机

# ---------- 通知设置 ----------
# 查重完成后可以通过多种方式通知您
[Notification]

# 通知类型: 查重完成后用什么方式发通知
# system  = Windows系统弹窗通知
# email   = 邮件通知（推荐，需要配置下面的 Email 部分）
# wecom   = 企业微信群机器人
# bark    = Bark iOS推送
# dingtalk = 钉钉群机器人
# none    = 不通知
notify_type = email

# 重复率阈值（%）: 当重复率达到多少时才发送通知
# 0     = 不启用，每次都发通知
# 1     = 重复率 >= 1% 时发通知
# 50    = 重复率 >= 50% 时才发通知
# 建议: 0 或 1
notify_duplicate_rate = 1

# 服务端连接失败时是否发送邮件通知
# true  = 连接不上服务端时发邮件告警
# false = 不发邮件
notify_on_connection_failure = true

# ---- 以下为各通知渠道的配置（根据 notify_type 选择填写） ----

# 企业微信机器人Webhook地址
# notify_type = wecom 时才需要填写
wecom_webhook = 

# Bark推送地址
# notify_type = bark 时才需要填写
# 格式: https://api.day.app/你的密钥
bark_url = 

# 钉钉机器人Webhook地址
# notify_type = dingtalk 时才需要填写
dingtalk_webhook = 

# ---------- 邮件通知设置 ----------
# 使用QQ邮箱发送查重结果通知
# notify_type = email 时才需要配置
[Email]

# SMTP服务器地址: QQ邮箱固定用 smtp.qq.com
smtp_server = smtp.qq.com

# SMTP端口: QQ邮箱用 587（TLS加密）
smtp_port = 587

# 发件邮箱账号: 用于登录SMTP服务器的QQ邮箱
smtp_username = xiaojiukali@qq.com

# 发件邮箱授权码: 不是QQ密码！
# 获取方法: 登录QQ邮箱 → 设置 → 账户 → POP3/IMAP/SMTP/Exchange/CardDAV/CalDAV服务
# → 开启 POP3/SMTP服务 → 生成授权码 → 把生成的16位授权码填到这里
smtp_password = wnzepcahqmhmebjg

# 发件人地址: 邮件的"发件人"显示地址
# 通常和上面的 smtp_username 一样即可
from_addr = xiaojiukali@qq.com

# 收件人地址: 查重结果发给谁
# 多个收件人用英文逗号隔开，比如: a@qq.com,b@qq.com,c@qq.com
to_addrs = jiaqi.gao@ucpsolution.com,wenlong.zhang@ucpsolution.com,jiankun.zhao@ucpsolution.com,zhangxiu.guo@ucpsolution.com