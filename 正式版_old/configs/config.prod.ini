# ============================================
#   TXT查重工具 - 客户端生产配置示例
#   config.prod.ini
# ============================================
# 使用说明:
# - 将此文件作为客户端生产环境配置示例，修改 address 为服务端实际地址
# - 建议将 smtp_password 通过环境变量或凭据管理器提供
# ============================================

[Server]
# 服务端地址（示例）：
# address = http://192.168.1.50:5566
address = http://127.0.0.1:5566

[Client]
output_dir = 
save_unique = false
save_duplicates = false
threads = 0
chunk_size = 100000
machine_id = B

[Notification]
notify_type = email
notify_duplicate_rate = 1
notify_on_connection_failure = true

[Email]
smtp_server = smtp.qq.com
smtp_port = 587
smtp_username = xiaojiukali@qq.com
# smtp_password should be provided via secure channel
smtp_password = 
from_addr = xiaojiukali@qq.com
to_addrs = jiaqi.gao@ucpsolution.com,wenlong.zhang@ucpsolution.com,jiankun.zhao@ucpsolution.com

# End of production sample
