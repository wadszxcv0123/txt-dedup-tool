# ============================================
#   TXT查重工具 - 服务端生产配置示例
#   server_config.prod.ini
# ============================================
# 使用说明:
# - 将此文件作为生产环境配置示例，修改后替换正式版的 server_config.ini
# - 请确保将 index_dir 指向专用数据盘的绝对路径（例如 D:\dedup_index）
# - 不要在版本库中提交带有明文密码的文件（如 SMTP 密码）
# ============================================

[Server]
host = 0.0.0.0
port = 5566
index_dir = D:\dedup_index
use_sqlite = false
storage_type = lmdb
lmdb_shard_count = 8
lmdb_map_size_gb = 4
sqlite_cache_size_mb = 1024

[ServerOptimization]
auto_optimize = true
process_priority = HIGH
sqlite_multi_thread = true
sqlite_exclusive_lock = true
mmap_size_gb = 2
wal_passive_checkpoint = true
wal_checkpoint_interval = 300

[Log]
log_level = INFO
log_dir = logs

[Performance]
max_batch_size = 10000
request_timeout = 120

[HealthMonitor]
memory_warning_mb = 4096
memory_critical_mb = 6144
disk_warning_gb = 100
disk_critical_gb = 50
connection_warning = 100
connection_critical = 500
health_check_interval = 60
health_enable_email = true

[AutoCleanup]
enabled = true
max_disk_usage_gb = 3500
cleanup_trigger_percent = 95
cleanup_target_percent = 90
cleanup_batch_size = 50000

[Email]
smtp_server = smtp.qq.com
smtp_port = 587
smtp_username = xiaojiukali@qq.com
# smtp_password should not be stored in plain text. Use env or secret manager.
smtp_password = 
from_addr = xiaojiukali@qq.com
to_addrs = jiaqi.gao@ucpsolution.com,wenlong.zhang@ucpsolution.com,jiankun.zhao@ucpsolution.com

# End of production sample
