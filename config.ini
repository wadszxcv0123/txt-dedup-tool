# ============================================
#   TXT查重工具 - 客户端配置文件
#   config.ini
# ============================================
#   修改后无需重启，下次查重时自动生效
#   格式: 参数名 = 值
#   井号(#)开头的行为注释，不会生效

# ---------- 服务端设置 ----------
[Server]

# 服务端地址: 客户端通过此地址连接服务端
# 格式: http://IP或域名:端口
# 例如: http://192.168.1.100:5566
address = http://localhost:5566

# ---------- 客户端设置 ----------
[Client]

# 输出目录: 查重结果文件保存的位置
# 留空 = 与输入文件同目录
# 例如: D:\查重结果  或  E:\output
output_dir =

# 是否保存唯一数据: 查重后将不重复的数据另存为文件
# true  = 生成 xxx_unique.txt 文件
# false = 不保存
save_unique = false

# 是否保存重复数据: 查重后将重复的数据另存为文件
# true  = 生成 xxx_duplicates.txt 文件
# false = 不保存
save_duplicates = false

# 线程数: 客户端计算模式下使用的线程数
# 0 = 自动检测（推荐）
# 手动设置: 建议设为 CPU核心数-1
threads = 0

# 分块大小: 每次读取处理的行数
# 100000 = 每次读10万行（推荐）
# 太小影响效率，太大占用内存
chunk_size = 100000

# 机台标识: 标记当前客户端所属的机台/电脑
# 用于追溯重复数据来源，建议设为机台编号或电脑名
# 例如: 机台1  或  QC-Line3-PC05
machine_id =机台2

# ---------- 性能设置 ----------
[Performance]

# 服务端计算模式: 上传原始数据由服务端计算哈希
# true  = 服务端计算（推荐多核服务器，减少客户端负载）
# false = 客户端计算（适合低带宽环境，只传哈希值）
server_compute_mode = false

# 服务端计算批大小: 每次上传的行数
# 100000 = 每次上传10万行
# gzip压缩后网络传输量小，可适当调大
server_compute_chunk_size = 100000

# ---------- 通知设置 ----------
[Notification]

# 通知方式: 查重完成后发送通知
# email   = 邮件通知
# wecom   = 企业微信群机器人
# bark    = Bark (iOS推送)
# dingtalk = 钉钉群机器人
# system  = Windows系统弹窗
# none    = 不通知
notify_type = email

# 重复率阈值(%): 重复率超过此值才发送通知
# 0 = 只要有重复就通知
# 1 = 重复率超过1%才通知
# 50 = 重复率超过50%才通知
notify_duplicate_rate = 1

# 连接失败通知: 服务端连接失败时发送邮件提醒
# true  = 连接失败时发邮件
# false = 不发送
notify_on_connection_failure = true

# 企业微信 Webhook URL: 企业微信群机器人的 Webhook 地址
# 获取方式: 企业微信群 → 群设置 → 群机器人 → 添加机器人 → 复制 Webhook 地址
wecom_webhook =

# Bark URL: iOS Bark 推送的 URL 前缀
# 格式: https://api.day.app/你的KEY
bark_url =

# 钉钉 Webhook URL: 钉钉群机器人的 Webhook 地址
# 获取方式: 钉钉群 → 群设置 → 智能群助手 → 添加机器人 → 复制 Webhook 地址
dingtalk_webhook=

