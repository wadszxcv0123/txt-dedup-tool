# ============================================
#   TXT查重工具 - 服务端配置文件
#   server_config.ini
# ============================================
#   修改后需重启服务端才能生效
#   格式: 参数名 = 值
#   井号(#)开头的行为注释，不会生效
#
#  *** 重要：磁盘部署建议 ***
#  120GB SSD  → 仅安装 Windows Server 2022 操作系统
#  4TB×2 RAID 1 → 可用4TB，存放数据库(.dedup_index)和所有TXT源文件
#  请将 index_dir 设置为 RAID 盘上的路径！
# ============================================

# ---------- 服务端基本设置 ----------
[Server]

# 监听地址: 仅监听内网地址，不对外暴露
# 0.0.0.0 = 接受所有网卡连接
# 192.168.167.200 = 仅接受内网连接（更安全）
host = 0.0.0.0

# 监听端口: 客户端通过此端口连接服务端
port = 8888

# 数据库存放目录: 所有哈希值数据存储在这里
# *** 务必放在 4TB×2 RAID 盘上，不要放 120GB SSD！***
# 例如: D:\.dedup_index  或  E:\dedup_data
# 留空或相对路径 = 程序同目录（如果在SSD上会占满系统盘）
index_dir = .dedup_index

# 存储类型: SQLite 或 LMDB
# sqlite = SQLite数据库（稳定，推荐）
# lmdb = LMDB数据库（高性能）
storage_type = lmdb

# ---------- LMDB 数据库设置 ----------
# LMDB是高性能键值存储，适合大量读写场景

# LMDB分片数量: 提高并发性能
lmdb_shard_count = 8

# LMDB映射大小（GB）: 数据库最大容量
lmdb_map_size_gb = 32

# 最大读取器数量: 支持更多并发连接
lmdb_max_readers = 128

# 启用内存映射: 提高读取性能
lmdb_writemap = true

# 异步同步: 提高写入性能（数据安全性降低）
lmdb_sync = false

# 元数据异步同步: 进一步提高性能
lmdb_metasync = false

# ---------- SQLite 数据库设置 ----------

# SQLite缓存大小（MB）: 缓存越大查重越快，但占用更多内存
# 1024MB，适合16GB RAM + HDD RAID 的服务器
# HDD寻道慢，大缓存可以显著减少磁盘I/O
# 程序会根据实际内存自动调整（16GB→1024MB, 32GB→2048MB）
sqlite_cache_size_mb = 10240

# ---------- 服务器优化设置 ----------
# 仅在 Windows Server 环境下生效（内存>=8GB 或 CPU>=4核 自动启用）
# 针对 HDD RAID 的优化：WAL模式将随机写转为顺序写，大幅提升HDD性能
[ServerOptimization]

# 是否启用服务器模式自动优化
# true  = 自动检测硬件并应用以下优化（推荐）
# false = 手动控制，使用标准模式
auto_optimize = true

# 进程优先级: 提升进程调度优先级，减少响应延迟
# 仅在 Windows Server 上生效，普通桌面系统无影响
# 可选: HIGH(高) / ABOVE_NORMAL(高于正常) / NORMAL(正常)
process_priority = HIGH

# 多线程排序: 启用 SQLite 多线程并行排序（需要 SQLite 3.8.7+）
# true  = 利用多核 CPU 加速排序和查询
# false = 单线程模式
sqlite_multi_thread = true

# 独占锁模式: 由于只有一个服务端进程访问数据库，跳过锁开销
# true  = 独占锁模式，性能提升约 10-15%
# false = 标准锁模式（多进程安全）
sqlite_exclusive_lock = true

# 内存映射I/O大小（GB）: 将数据库文件直接映射到内存
# HDD RAID 尤其受益：减少物理寻道，将随机读转为内存访问
# 16GB RAM → 2GB，程序会根据实际内存自动调整
mmap_size_gb = 2

# WAL被动checkpoint: 在系统空闲时后台合并WAL文件
# HDD RAID 建议开启，减少业务高峰期磁盘I/O
# true  = 空闲时后台合并WAL，写入更平滑
# false = 仅在WAL达到阈值时合并
wal_passive_checkpoint = true

# WAL checkpoint间隔（秒）: 多久检查一次是否需要合并WAL
# 300 = 每5分钟检查一次，只在WAL>1MB时才执行
wal_checkpoint_interval = 300

# ---------- 日志设置 ----------
[Log]

# 日志级别: DEBUG(最详细) / INFO(常规) / WARNING(警告) / ERROR(错误)
# 正式使用时建议 INFO，排查问题时改用 DEBUG
log_level = INFO

# 日志存放目录: 相对于server.exe所在目录
log_dir = logs

# ---------- 性能设置 ----------
[Performance]

# 每次批量处理的最大条数: 建议不要超过此值
# 太大可能卡顿，太小影响效率
max_batch_size = 10000

# 请求超时时间（秒）: 超过此时间未完成则返回错误
request_timeout = 120

# ---------- 健康监控设置 ----------
# 服务端会自动监控内存、磁盘、连接数
# 异常时发送邮件告警（每种告警只发一次，不会重复发）
[HealthMonitor]

# ---- 内存告警 ----
# 服务端程序占用的内存超过此值（MB）时，只发 1 次警告邮件
# 4096 = 4GB，当服务端内存占用超过4GB时发一次提醒
# 如果您的机器内存大（32G以上），可以调高到 8192
memory_warning_mb = 4096

# 服务端程序占用的内存超过此值（MB）时，只发 1 次严重告警邮件
# 6144 = 6GB，当内存占用超过6GB时发紧急提醒，说明可能有内存泄漏
# 正常情况不应该超过此值，如果超过需要排查问题
memory_critical_mb = 6144

# ---- 磁盘告警 ----
# 硬盘剩余空间低于此值（GB）时，只发 1 次警告邮件
# 100 = 当硬盘只剩100GB空间时提醒，提醒您关注磁盘使用情况
disk_warning_gb = 100

# 硬盘剩余空间低于此值（GB）时，只发 1 次严重告警邮件
# 50 = 当硬盘只剩50GB空间时发紧急提醒，说明磁盘空间已经很紧张
# 此时建议手动清理磁盘或添加新硬盘
disk_critical_gb = 50

# ---- 连接数告警 ----
# 同时连接服务端的客户端数量超过此值时，只发 1 次警告邮件
# 100 = 当有超过100台客户端同时在线时提醒，说明服务端压力较大
# 正常情况下不会有这么多客户端，除非有特殊需求
connection_warning = 100

# 同时连接服务端的客户端数量超过此值时，只发 1 次严重告警邮件
# 500 = 当有超过500台客户端同时在线时发紧急提醒
# 此时服务端可能已经承受不了，建议增加服务端节点
connection_critical = 500

# ---- 检查频率 ----
# 健康检查间隔（秒）: 多久检查一次内存和连接数
# 60 = 每60秒（1分钟）检查一次
# 检查到异常时才发邮件，不会频繁发邮件
health_check_interval = 60

# 磁盘检查: 每次客户端查重完成后检查一次磁盘
# 不再定时检查磁盘，仅在导入文件后检查
# disk_check_interval 已废弃，保留此参数仅为兼容旧版本

# 是否发送健康告警邮件
# true = 开启，内存/磁盘/连接数异常时发邮件
# false = 关闭，不发送任何告警邮件
health_enable_email = true

# ---------- 自动清理设置 ----------
# 像硬盘录像机一样，磁盘满时自动删除最早的数据
# 监控的是 index_dir 所在的磁盘（应为RAID盘，非SSD系统盘）
[AutoCleanup]

# 是否启用自动清理
# true  = 磁盘满了自动删除最早的数据
# false = 磁盘满了只发告警，不自动清理
enabled = true

# 最大磁盘使用容量（GB）: 设置为RAID盘的总容量
# 4TB×2 RAID 1 = 可用4TB，建议设为 3500 留500GB缓冲
max_disk_usage_gb = 3500

# 触发清理的磁盘使用率（%）
# 当磁盘使用率达到此百分比时，自动删除最早的数据
# 建议 95，即磁盘用了95%时触发
cleanup_trigger_percent = 95

# 清理目标磁盘使用率（%）
# 清理到此百分比后停止删除
# 建议 90，即清理到90%
cleanup_target_percent = 90

# 每次清理最多删除多少条数据
# 分批次清理避免卡顿，下次检查时如果还不够会继续清理
cleanup_batch_size = 100000

# ---------- 邮件通知设置 ----------
# 使用QQ邮箱发送告警和通知
[Email]

# SMTP服务器地址（QQ邮箱）
smtp_server = smtp.qq.com

# SMTP端口（QQ邮箱用587）
smtp_port = 587

# 发件邮箱账号
smtp_username = xiaojiukali@qq.com

# 发件邮箱授权码（不是QQ密码！）
# 获取方法: QQ邮箱 → 设置 → 账户 → POP3/SMTP服务 → 生成授权码
smtp_password = wnzepcahqmhmebjg

# 发件人地址（通常和账号相同）
from_addr = xiaojiukali@qq.com

# 收件人地址（多个用英文逗号隔开）
# 查重完成、崩溃告警、健康告警都发到这里
to_addrs = jiaqi.gao@ucpsolution.com,wenlong.zhang@ucpsolution.com,jiankun.zhao@ucpsolution.com

# ---------- 数据库维护设置 ----------
# 定期执行完整性校验和空间回收
[Maintenance]

# 数据库完整性校验：每周几执行（0=周一, 1=周二 ... 6=周日）
# 建议周日凌晨执行，不影响正常使用
integrity_check_day = 6

# 完整性校验执行时间（24小时制，格式 HH:MM）
integrity_check_time = 03:00

# 数据库VACUUM优化：每周几执行
# 删除大量数据后回收磁盘空间，建议和校验错开（如周三）
# 自动执行流程: VACUUM → REINDEX(索引重建) → ANALYZE(统计更新)
vacuum_day = 2

# VACUUM执行时间（24小时制）
vacuum_time = 03:00

# ---------- API频率限制 ----------
# 防止客户端程序异常时疯狂刷请求
[RateLimit]

# 是否启用API频率限制
# true  = 启用频率限制
# false = 禁用频率限制
enabled = false

# 每个IP每分钟最大请求数
# 正常查重一个文件约10-30次请求，120足够
# 超过限制后该IP将被封禁60秒
max_requests_per_minute = 120

# ---------- Web管理看板 ----------
# 通过浏览器查看服务端状态，无需调用API
[Dashboard]

# 是否启用Web管理看板
# 启用后访问 http://服务器地址:端口/ 即可查看
enabled = true

# 看板自动刷新间隔（秒）
refresh_interval = 30

# ---------- 数据趋势统计 ----------
# 记录每月数据量变化趋势
[Trends]

# 是否启用数据趋势统计
enabled = true

# 统计间隔（天）：30=每月统计一次
stats_interval_days = 30

# ---------- 服务端事件通知 ----------
# 服务端启动/停止时发送邮件通知
[StartupNotification]

# 是否启用启停通知
# 仅在启动和正常停止时各发送一次，不会频繁发送
enabled = true